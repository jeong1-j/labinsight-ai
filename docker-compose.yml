services:
  postgres:
    image: postgres:16-alpine
    container_name: labinsight-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labinsight
      POSTGRES_PASSWORD: labinsight
      POSTGRES_DB: labinsight_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
